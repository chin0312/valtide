name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quant-tests:
    name: Valtide Quant Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install quant package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./valtide-quant-service-p1ac

      - name: Run quant tests
        run: python -m pytest valtide-quant-service-p1ac/tests -q

  backend-tests:
    name: Valtide Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend and quant packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./valtide-quant-service-p1ac
          python -m pip install -e "./apps/api[dev]"

      - name: Run backend tests
        run: python -m pytest apps/api/tests -q

  quality-demo:
    name: Valtide Quality + Demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend and quant packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./valtide-quant-service-p1ac
          python -m pip install -e "./apps/api[dev]"

      - name: Run Ruff
        run: ruff check apps/api

      - name: Compile backend package
        run: python -m compileall -q apps/api/valtide_api

      - name: Run deterministic demo
        run: python scripts/demo_value.py

  contracts:
    name: Valtide Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check contract formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Run contract tests
        working-directory: contracts
        run: forge test -vvv
