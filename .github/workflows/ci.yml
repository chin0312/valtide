name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quant-tests:
    name: Valtide Quant Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install quant package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./valtide-quant-service-p1ac

      - name: Run quant tests
        run: python -m pytest valtide-quant-service-p1ac/tests -q

  backend-tests:
    name: Valtide Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend and quant packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./valtide-quant-service-p1ac
          python -m pip install -e "./apps/api[dev]"

      - name: Run backend tests
        run: python -m pytest apps/api/tests -q

  quality-demo:
    name: Valtide Quality + Demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend and quant packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./valtide-quant-service-p1ac
          python -m pip install -e "./apps/api[dev]"

      - name: Run Ruff
        run: ruff check apps/api scripts

      - name: Compile backend package
        run: python -m compileall -q apps/api/valtide_api

      - name: Run deterministic demo
        run: python scripts/demo_value.py

      - name: Build Railway container
        run: docker build -t valtide-api:test .

      - name: Smoke Railway container
        run: |
          set -Eeuo pipefail

          container_name="valtide-api-ci-${GITHUB_RUN_ID:-local}"
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              echo "::group::safe container logs"
              docker logs "$container_name" || true
              echo "::endgroup::"
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --env PORT=8000 \
            --env LIVE_SCHEDULER_ENABLED=false \
            --env PUBLISH_ENABLED=false \
            --publish 127.0.0.1:8000:8000 \
            valtide-api:test

          for attempt in $(seq 1 30); do
            health_code="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' http://127.0.0.1:8000/health || true)"
            if [ "$health_code" = "200" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "container did not become healthy (last HTTP status: $health_code)"
              exit 1
            fi
            sleep 2
          done

          health_code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:8000/health || true)"
          if [ "$health_code" != "200" ]; then
            echo "GET /health returned HTTP $health_code"
            exit 1
          fi

          assets_code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:8000/api/assets || true)"
          if [ "$assets_code" != "200" ]; then
            echo "GET /api/assets returned HTTP $assets_code"
            exit 1
          fi

          echo "container smoke passed: /health=200 /api/assets=200"

  contracts:
    name: Valtide Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.8.3"

      - name: Check contract formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Run contract tests
        working-directory: contracts
        run: forge test -vvv
