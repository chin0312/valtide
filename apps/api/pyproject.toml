[project]
name = "valtide-api"
version = "0.1.0"
description = "Valtide backend — orchestration & API layer for tokenized-equity collateral validation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "web3>=6.20,<8",
    "tzdata; platform_system == 'Windows'",
    "valtide-quant-service==0.2.0",
]

[project.optional-dependencies]
data = [
    "alpaca-py>=0.21",   # NVDA underlying (same source as James's training)
]
schedule = [
    "apscheduler>=3.10", # live 5-min loop (P1)
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str+Enum is intentional for clean Pydantic/JSON value serialization.
ignore = ["UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["valtide_api*"]

[tool.setuptools.package-data]
valtide_api = ["scenarios/*.json", "abis/*.json"]
